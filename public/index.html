<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5b5bf0">
<title>Outreach</title>
<script>try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="login" class="hide">
  <form class="card stack" id="lf">
    <div class="brand" style="padding:0"><i id="logoI"></i>Outreach</div>
    <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <button class="btn p" style="width:100%;justify-content:center">Sign in</button>
    <div class="hint" id="le" style="color:var(--bad)"></div>
  </form>
</div>

<div id="app" class="shell hide">
  <aside class="side">
    <div class="brand"><i class="lg"></i>Outreach</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div class="quota"><b id="qTxt"></b><div class="meter"><i id="qBar" style="width:0"></i></div><div class="hint" style="margin-top:6px;font-size:12px">Daily send limit</div></div>
      <div class="foot2">
        <button class="btn s" id="bTheme" style="flex:1;justify-content:center" title="Toggle dark mode"></button>
        <button class="btn s" id="bOut" style="flex:1;justify-content:center">Sign out</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top"><h1 id="title"></h1><div class="sp"></div><span class="hint hm" id="topHint"></span><button class="btn s g" id="bThemeM" title="Toggle dark mode"></button></header>
    <section id="view"></section>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="ov"></div>
<div id="toast"></div>
<script src="/app.js"></script>
<script src="/leads.js"></script>
<script src="/replies.js"></script>
<script src="/assistant.js"></script>
</body>
</html>
