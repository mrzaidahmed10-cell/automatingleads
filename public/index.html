<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#080a0f">
<title>FlightLine</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div id="login" class="hide">
  <form class="card stack" id="lf">
    <img class="lmark" src="icons/logo-96.png" alt="FlightLine" width="64" height="64">
    <h1>FlightLine</h1>
    <p class="tag">Sign in to continue</p>
    <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus required></div>
    <button class="btn p" style="width:100%;justify-content:center">Sign in</button>
    <div class="hint" id="le" role="alert" style="color:var(--bad)"></div>
  </form>
</div>

<div id="app" class="shell hide">
  <div id="aurora" aria-hidden="true"></div>
  <aside class="side">
    <div class="brand"><img class="mark" src="icons/logo-96.png" alt="" width="32" height="32"><span class="bn">FlightLine<small>Outreach</small></span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sidefoot">
      <div class="quota"><b id="qTxt"></b><div class="meter" role="presentation"><i id="qBar" style="width:0"></i></div><div class="hint" id="qCap" style="margin-top:5px;font-size:11.5px"></div></div>
      <div class="foot2">
        <button class="btn s" id="bOut" style="flex:1;justify-content:center" aria-label="Sign out"><span class="bt">Sign out</span><span class="bi"></span></button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title"></h1><div class="sp"></div>
      <span class="hint hm" id="topHint"></span>
      <div id="topTools"></div>
      <span id="topFallback">
        <button class="btn s" id="bPal" data-act="palette" aria-label="Quick jump (Ctrl K)"></button>
        <button class="btn s g" id="bDens" data-act="density"></button>
        <button class="btn s g" id="bThemeM" aria-label="Toggle dark mode"></button>
      </span>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>

<div id="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="glass.js"></script>
<script src="app.js"></script>
<script src="finder.js"></script>
<script src="leads.js"></script>
<script src="replies.js"></script>
<script src="assistant.js"></script>
<script src="a11y.js"></script>
<script src="jelly.js"></script>
</body>
</html>
